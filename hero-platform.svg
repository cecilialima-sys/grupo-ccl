<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="720" rx="48" fill="url(#bg)"/>
  <circle cx="760" cy="120" r="88" fill="#39B8FF" fill-opacity="0.18"/>
  <circle cx="160" cy="580" r="140" fill="#FFFFFF" fill-opacity="0.08"/>
  <rect x="82" y="560" width="796" height="28" rx="14" fill="#2E343B"/>

  <g id="machine-base">
    <rect x="185" y="506" width="244" height="34" rx="17" fill="url(#machineBlue)"/>
    <rect x="220" y="476" width="74" height="40" rx="8" fill="#3D434A"/>
    <rect x="318" y="476" width="74" height="40" rx="8" fill="#3D434A"/>
    <circle cx="246" cy="564" r="34" fill="#1A1D21"/>
    <circle cx="246" cy="564" r="16" fill="#8D949C"/>
    <circle cx="388" cy="564" r="34" fill="#1A1D21"/>
    <circle cx="388" cy="564" r="16" fill="#8D949C"/>
    <circle cx="430" cy="500" r="17" fill="#39B8FF"/>
    <circle cx="430" cy="500" r="8" fill="#D5ECFF"/>
  </g>

  <g id="boom-arm">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      values="-3 430 500;8 430 500;-3 430 500"
      dur="5.5s"
      repeatCount="indefinite"
    />

    <path d="M312 500L458 376" stroke="url(#machineBlue)" stroke-width="20" stroke-linecap="round"/>
    <path d="M396 500L500 388" stroke="url(#machineBlue)" stroke-width="20" stroke-linecap="round"/>

    <g id="upper-arm">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="2 458 376;-10 458 376;2 458 376"
        dur="5.5s"
        repeatCount="indefinite"
      />

      <path d="M458 376L600 282" stroke="url(#machineBlue)" stroke-width="20" stroke-linecap="round"/>
      <rect x="472" y="264" width="166" height="28" rx="10" fill="url(#machineBlue)"/>
      <rect x="548" y="292" width="16" height="214" rx="8" fill="#B0B5BC"/>
    </g>
  </g>

  <rect x="672" y="190" width="118" height="240" rx="24" fill="#23282E" fill-opacity="0.72"/>
  <path d="M706 236H756" stroke="#39B8FF" stroke-width="14" stroke-linecap="round"/>
  <path d="M706 282H756" stroke="#39B8FF" stroke-width="14" stroke-linecap="round"/>
  <path d="M706 328H736" stroke="#39B8FF" stroke-width="14" stroke-linecap="round"/>

  <defs>
    <linearGradient id="bg" x1="100" y1="52" x2="828" y2="648" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A2744"/>
      <stop offset="1" stop-color="#0A1222"/>
    </linearGradient>
    <linearGradient id="machineBlue" x1="218" y1="274" x2="639" y2="519" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39B8FF"/>
      <stop offset="1" stop-color="#0A4EB3"/>
    </linearGradient>
  </defs>
</svg>
